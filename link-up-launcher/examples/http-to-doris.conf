# HTTP Source → Doris Sink 示例
#
# 从 JSONPlaceholder API 读取用户数据，写入 Doris 表。
#
# 运行命令：
#   D:\tianxy\soft\apache-maven-3.9.16\bin\mvn.cmd -pl link-up-launcher exec:java "-Dexec.args=link-up-launcher/examples/http-to-doris.conf"

job.name = "http-source-to-doris-sink"

env {
  source-parallelism = 1
  sink-parallelism = 1
  channel-capacity = 64
}

source {
  type = "http"
  batch-size = 100
  url = "https://jsonplaceholder.typicode.com/users"
  method = "GET"
  format = "json"
  schema.fields = {
    id = "bigint"
    name = "string"
    username = "string"
    email = "string"
    phone = "string"
    website = "string"
  }
}

sink {
  type = "doris"
  # Doris FE HTTP 地址，多个逗号分隔
  fenodes = "127.0.0.1:8030"
  username = "root"
  password = ""
  database = "test_db"
  table = "http_users"
  # Stream Load 标签前缀（需全局唯一）
  sink.label-prefix = "http_load"
  # 每批写入行数
  doris.batch.size = 1000
  # 数据格式：JSON 或 CSV
  doris.load-format = "JSON"
}
