# File Source -> Print Sink reference pipeline (local csv).
# Run from the repository root:
# mvn -pl link-up-launcher -am compile exec:java \
#   -Dexec.args=link-up-launcher/examples/file-to-print.conf
job.name = "file-to-print-example"

env {
  source-parallelism = 2
  sink-parallelism = 1
  channel-capacity = 64
}

source {
  type = "localfile"
  batch-size = 2
  # Resolved from the working directory of the launcher process.
  path = "link-up-launcher/examples/data/orders"
  format = "csv"
  table_name = "orders"
  skip_header_rows = 1
  split_size = 1048576
  schema = [
    { name = "id", type = "bigint" }
    { name = "city", type = "string" }
    { name = "amount", type = "decimal(10,2)" }
  ]
}

sink {
  type = "print"
}
